name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file exists
        run: |
          test -f index.html
          echo "index.html found"

      - name: Check expected heading
        run: |
          grep -q "<h1>SkillSphere CI/CD Demo</h1>" index.html
          echo "Expected heading found"
